<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Studio</title>
    <!-- 1. CDN Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Конфигурация цветов для Tailwind CDN -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' },
                        dark: { bg: '#090d16', card: '#111726', border: '#1f293d', hover: '#1a2336' }
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-bg text-slate-200 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div class="relative z-10 flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">

        <header class="py-6 flex items-center justify-between border-b border-dark-border mb-8">
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                TaskFlow <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-500 border border-brand-500/20 font-medium">Studio</span>
            </h1>
            <div id="status-badge" class="flex items-center space-x-2 bg-dark-card border border-dark-border px-3 py-1.5 rounded-full text-xs font-medium text-slate-400">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span>Подключение...</span>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 pb-12">

            <!-- Левая колонка: Форма -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass border border-dark-border rounded-2xl p-6 shadow-xl sticky top-8">
                    <h2 class="text-lg font-semibold text-white mb-1">Создать задачу</h2>
                    <p class="text-sm text-slate-400 mb-6">Здесь вы можете создать задачу</p>

                    <form id="create-task-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Название</label>
                            <input type="text" id="task-title" required placeholder="Заголовок..."
                                class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Описание</label>
                            <textarea id="task-desc" rows="3" placeholder="Подробности задачи..."
                                class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 custom-scrollbar resize-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Приоритет</label>
                            <select id="task-priority" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                                <option value="low">Низкий (Low)</option>
                                <option value="medium" selected>Средний (Medium)</option>
                                <option value="high">Высокий (High)</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full mt-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-lg shadow-brand-600/20 active:scale-[0.98]">
                            <span>Создать</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Правая колонка: Список задач -->
            <div class="lg:col-span-8 space-y-6">

                <div class="grid grid-cols-3 gap-4">
                    <div class="glass border border-dark-border rounded-2xl p-4">
                        <div class="text-xs font-medium text-slate-400">Всего задач</div>
                        <div class="text-2xl font-bold text-white mt-1" id="stat-total">0</div>
                    </div>
                    <div class="glass border border-dark-border rounded-2xl p-4">
                        <div class="text-xs font-medium text-slate-400">В процессе</div>
                        <div class="text-2xl font-bold text-amber-400 mt-1" id="stat-pending">0</div>
                    </div>
                    <div class="glass border border-dark-border rounded-2xl p-4">
                        <div class="text-xs font-medium text-slate-400">Завершено</div>
                        <div class="text-2xl font-bold text-emerald-400 mt-1" id="stat-completed">0</div>
                    </div>
                </div>

                <div class="glass border border-dark-border rounded-2xl p-6 min-h-[450px] flex flex-col">
                    <h2 class="text-lg font-semibold text-white mb-6">Список задач из бэкенда</h2>

                    <div id="tasks-container" class="space-y-3 flex-1 custom-scrollbar overflow-y-auto max-h-[600px] pr-1">
                        <div class="text-slate-500 text-center py-12">Загрузка данных...</div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
